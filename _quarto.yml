project:
  type: website
  output-dir: docs/
  resources:
    - "assets/Archive.zip"
    - "scripts/microclimate_warmup_minimal.R"
    
  
  render:
    - "index.qmd"
    - "pages/**/*.qmd"
    - "slides/*.qmd"
    - "scripts/*.R"

website:
  title: "Modellieren in der Geographie"
  favicon: /images/logo.png
  bread-crumbs: false
  open-graph: true
  page-navigation: true
  site-url: https://gisma-courses.github.io/geo-mod-2026
  repo-url: https://github.com/gisma-courses/geo-mod-2026
  repo-actions: [edit, issue]
  repo-branch: main

  search:
    location: navbar
    type: textbox

  twitter-card:
    creator: "@gisma"

  comments: false

  # navbar:
  #   logo: /images/logo.png
  #   right:
  #     - text: "AddOns"
  #       menu:
  #         - icon: book
  #           href: pages/microclimate_warmup_reader.qmd
  #           text: Mikroklima-Warmup Reader
  #         - icon: easel
  #           href: slides/microclimate_warmup_models_revealjs.qmd
  #           text: Mikroklima-Warmup Foliensatz

  sidebar:
    - title: "Modellieren in der Geographie"
      style: "docked"
      collapse-level: 1
      pinned: true
      contents:
        - href: index.qmd
          text: Kursübersicht
        - text: "---"
        - section: "Reader"
          contents:
            - href: pages/modellbildung_gis_reader.qmd
              text: Grundlagen der Modellbildung
        - section: "Slides / Folien"
          contents:
            - href: pages/modellbildung_gis_folien.qmd
              text: Modellbildung im GIS
            - href: pages/netlogo_modellvergleich.qmd
              text: NetLogo – Modellvergleich
        - section: "Worksheets / Hands-on"
          contents:
            - href: pages/meander_abfluss_saga_grass.qmd
              text: Burgwald – Abfluss mit SAGA / GRASS

execute:
  freeze: auto
  echo: false
  message: false
  warning: false
  cache: false

format:
  html:
    code-overflow: wrap
    toc-title: "Inhalt"
    number-sections: false
    highlight-style: github
    theme:
      light: cerulean
      dark: lumen
    code-copy: true
    toc: true
    link-external-icon: false
    link-external-newwindow: true

  revealjs:
    theme:
      - default
      - metropolis.scss
    slide-number: true
    transition: fade
    incremental: false