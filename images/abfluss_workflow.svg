ans-serif" font-size="18" font-weight="700" text-anchor="start" x="963" y="85">ATKIS-Gewässer</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="963" y="111">nur Lagevergleich</text><rect fill="#eaf4fb" height="98" rx="13" stroke="#176a9e" stroke-width="1.6" width="245" x="34" y="227" /><text fill="#176a9e" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="52" y="257">D8-Richtung → p</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="52" y="283">1 Empfänger pro Zelle</text><rect fill="#eaf4fb" height="98" rx="13" stroke="#176a9e" stroke-width="1.6" width="245" x="334" y="227" /><text fill="#176a9e" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="352" y="257">AreaD8 → ad8</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="352" y="283">Anzahl Zellen → m²</text><rect fill="#eaf4fb" height="98" rx="13" stroke="#176a9e" stroke-width="1.6" width="245" x="634" y="227" /><text fill="#176a9e" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="652" y="257">Schwelle + Auslass</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="652" y="283">Gerinne · Einzugsgebiet</text><rect fill="#eaf4fb" height="98" rx="13" stroke="#176a9e" stroke-width="1.6" width="245" x="934" y="227" /><text fill="#176a9e" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="952" y="257">10 mm effektiv</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="952" y="283">m³, keine Ganglinie</text><rect fill="#e9f6ed" height="98" rx="13" stroke="#23734d" stroke-width="1.6" width="245" x="34" y="424" /><text fill="#23734d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="52" y="454">D∞-Richtung → ang</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="52" y="480">bis zu 2 Empfänger</text><rect fill="#e9f6ed" height="98" rx="13" stroke="#23734d" stroke-width="1.6" width="245" x="334" y="424" /><text fill="#23734d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="352" y="454">AreaDinf → sca</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="352" y="480">m²/m = m</text><rect fill="#e9f6ed" height="98" rx="13" stroke="#23734d" stroke-width="1.6" width="245" x="634" y="424" /><text fill="#23734d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="652" y="454">TWI</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="652" y="480">ln(a / tan β)</text><rect fill="#f2edf8" height="98" rx="13" stroke="#66548c" stroke-width="1.6" width="245" x="934" y="424" /><text fill="#66548c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="952" y="454">Materialbilanz</text><text fill="#1c2e3c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="952" y="480">Angebot + Kapazität</text><text fill="#61717d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="34" y="589">Raster bleibt unverändert. Kein Ereignisverlauf, keine Gerinneentwicklung.</text><text fill="#61717d" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="34" y="614">Gestrichelter Bezug: ATKIS dient zum Vergleich, nicht als Routing-Eingabe.</text></svg>